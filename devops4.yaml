---
# Source: machine-manager/templates/pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: my-app-pvc

spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 1Gi

---
# Source: machine-manager/templates/service.yaml
apiVersion: v1
kind: Service

metadata:
  name: my-app

spec:
  type: ClusterIP

  selector:
    app: machine-manager

  ports:
    - port: 5001
      targetPort: 5001
      nodePort: 

---
# Source: machine-manager/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: my-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: machine-manager

  template:
    metadata:
      labels:
        app: machine-manager

    spec:
      containers:
        - name: machine-manager-container

          image: "machine-manager:1.0"

          imagePullPolicy: Never

          ports:
            - containerPort: 5001

          volumeMounts:
            - name: machine-storage
              mountPath: /configs

      volumes:
        - name: machine-storage
          persistentVolumeClaim:
            claimName: my-app-pvc
