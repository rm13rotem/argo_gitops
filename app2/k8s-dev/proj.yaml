apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: app2-project
  namespace: argocd
spec:
  description: Allow access to a specific Git repository and branch
  sourceRepos:
    - https://github.com/rm13rotem/argo_gitops.git
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  sourceNamespaces:
    - '*'
