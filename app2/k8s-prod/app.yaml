apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app2-k8s-prod
  namespace: argocd
spec:
  project: app2-project
  source:
    repoURL: https://github.com/rm13rotem/argo_gitops.git
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
